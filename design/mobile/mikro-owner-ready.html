function renew(){const c=selectedCard(),target=c&&routerPlans().find(p=>p.id===state.renewTarget&&p.source===c.source);const out=renewBeforeReady();if(!c||!target)return out;const a=cardAssessment(c);const compare=`<section class="mo-panel or-renew-impact"><h2>${t('ما الذي سيتغير لهذا الكرت؟','What changes for this voucher?')}</h2>${fact(t('المتبقي الآن من الحجم','Data remaining now'),readingValue(a.remaining,' MB'))}${fact(t('الحجم بعد التجديد','Data after renewal'),target.totalMB+' MB')}${fact(t('وقت الاتصال المتبقي الآن','Online time remaining now'),readingValue(a.timeRemaining,t(' دقيقة',' minutes')))}${fact(t('وقت الاتصال بعد التجديد','Online time after renewal'),target.minutes+t(' دقيقة',' minutes'))}${fact(t('الصلاحية الحالية','Current validity'),a.validity)}${fact(t('الصلاحية بعد التجديد في المثال','Validity after renewal in this demo'),target.validDays+t(' يوم من أول دخول تالٍ',' days from next first login'))}<p class="mo-copy">${t('في هذه المحاكاة تستبدل الحقوق بالباقة المختارة؛ المتبقي السابق لا يضاف إليها. إذا أردت إضافة رصيد متراكم فلا تؤكد هذا الإجراء.','In this simulation the selected plan replaces the allowance; the old remaining balance is not added. Do not confirm this action if you intend to add accumulated credit.')}</p><p class="mo-small">${t('يبقى نفس رقم الدخول وكلمة المرور. الكرت الموقوف يبقى موقوفًا. التنفيذ الفعلي للصلاحية ينتظر اختبار كل نظام.','The login and password stay the same. A disabled voucher stays disabled. Native validity behavior requires per-system testing.')}</p></section>`;const confirm=writeButton('renew-confirm',t('تأكيد التجديد للباقة المختارة','Confirm selected plan renewal'));return out.replace(confirm,compare+confirm);}

function connectionHelp(){return back('connect')+title(t('نساعدك تبدأ','Help getting started'),t('نحتاج بيانات دخول الراوتر، مرة واحدة.','We need the router login details once.'))+`<ol class="mo-copy"><li>${t('عنوان IP داخل الشبكة، أو عنوان التحكم DDNS إذا كنت بعيدًا.','A local IP address, or remote DDNS host when away.')}</li><li>${t('منفذ API الذي أعطاك المهندس؛ قد يختلف عن منفذ Winbox أو صفحة الويب.','The API port supplied by your engineer; it may differ from Winbox or the web page.')}</li><li>${t('اسم مستخدم وكلمة مرور لحساب مخول بالقراءة، وبالكتابة إذا كنت ستصدر أو تجدد كروتًا.','A login authorized to read, and to write if you will issue or renew vouchers.')}</li></ol><p class="mo-copy">${t('الاستكشاف يساعد في العثور على العنوان فقط. لا يعرف كلمة المرور ولا يفتح منفذًا مغلقًا.','Discovery helps find an address only. It does not discover passwords or open blocked ports.')}</p><label class="mo-field" for="or-engineer-request">${t('نص يمكنك نسخه وطلبه من المهندس','Text you can copy and ask your engineer')}<textarea id="or-engineer-request" rows="5" readonly>${t('أحتاج إعداد اتصال Mikro: عنوان الراوتر المحلي أو DDNS، ومنفذ API، وحسابًا بالصلاحيات المناسبة للفحص وإصدار الكروت. يرجى تزويدي ببيانات الدخول بطريقة خاصة وآمنة.','I need Mikro connection setup: the router local IP or DDNS host, API port, and an account with permission to inspect and issue vouchers. Please provide the login privately and securely.')}</textarea></label><p class="mo-small">${t('لا نرسل هذه الرسالة ولا نرفق كلمات مرور أو بيانات زبائن.','This request is not sent automatically and includes no passwords or customer data.')}</p>${button('go:connect',t('عندي البيانات، نكمل الربط','I have the details, continue'),true)}`;}
function packageForm(){const out=packageFormBeforeReady(),d=draftPlan();if(!d||state.packageStep!==2)return out;const summary=t('الأساسي كافٍ: حدد الوقت والصلاحية، واترك خيارات السرعة والأجهزة إن لم تحتج تغييرها.','The basics are enough: set time and validity. Leave speed and device settings unless you need to change them.');return out.replace('<details>',`<p class="mo-note">${summary}</p><details id="or-package-advanced" ${d.advancedOpen?'open':''}>`).replace('</details>',`<p class="mo-small">${t('مثال: جلسة واحدة تعني دخولًا متزامنًا واحدًا، وليست جهازًا واحدًا طوال عمر الكرت. Mbps هي وحدة السرعة؛ لا نختار سرعة لشبكتك من تلقاء أنفسنا.','Example: one session means one simultaneous login, not one lifetime device. Mbps measures speed; we do not choose a speed for your network automatically.')}</p></details>`);}

 else if(a.startsWith('deliver-entry:')){const b=issueBatches().find(b=>printEntries(b).some(v=>v.key===a.slice(14)));if(b){state.activeBatch=b.id;state.deliveryKey=a.slice(14);state.deliverySecret=false;go('delivery');}}
 else if(a==='delivery-secret'){state.deliverySecret=!state.deliverySecret;render();}
 else if(a.startsWith('delivery-channel:')){state.deliveryChannel=a.slice(17);render();}
 else if(a==='select-delivery-text'){const input=main.querySelector('#or-delivery-text');if(input&&typeof input.select==='function'){input.focus();input.select();main.querySelector('#or-select-notice').textContent=t('حددنا النص؛ انسخه بالطريقة المعتادة على جهازك.','Text selected; copy it using your device controls.');}else if(input)main.querySelector('#or-select-notice').textContent=t('اضغط مطولًا على النص وحدده للنسخ.','Select the text with your device’s text controls to copy it.');}
 else if(a==='connection-help')go('connection-help');
 else if(a.startsWith('design:')){state.activeBatch=null;state.designBatchId=null;state.selectedPlan=a.slice(7);state.selectedLayer='username';go('design');}
 else if(a==='save-template'&&state.designBatchId){const b=batchById(state.designBatchId);if(b){const d=activeDesign();d.dirty=false;d.status='ready';b.design=copied({...d,undo:[]});b.editDraft=null;r().templates[b.planId]={status:'ready',key:templateKey(),design:copied(b.design)};state.designBatchId=null;go('batch-detail');}}

 if(handled){e.preventDefault();e.stopImmediatePropagation();stateSave();}

 if(a==='save-template'){const d=activeDesign();d.dirty=false;d.status='ready';r().templates[state.selectedPlan]={status:'ready',key:templateKey(),design:JSON.parse(JSON.stringify({...d,undo:[]}))};go('plan-setup');return;}
 if(a==='choose-image'){root.querySelector('#mo-image').click();return;}
 if(a==='ready-style'){keepDesignUndo();activeDesign().image='';state.imageError='';render();return;}
 if(a.startsWith('select-layer:')){state.selectedLayer=a.slice(13);render();return;}
 if(a.startsWith('toggle-layer:')){const key=a.slice(13);keepDesignUndo();state.selectedLayer=key;activeDesign().layers[key].on=!activeDesign().layers[key].on;render();return;}
 if(a.startsWith('font:')){keepDesignUndo();const v=activeDesign().layers[state.selectedLayer];v.font=Math.max(8,Math.min(36,v.font+(a==='font:up'?1:-1)));render();return;}
 if(a==='center-layer'||a==='reset-layer'){keepDesignUndo();const v=activeDesign().layers[state.selectedLayer];if(a==='center-layer')v.x=50;else{v.x=layerDefs[state.selectedLayer].x;v.y=layerDefs[state.selectedLayer].y;}render();return;}
 if(a==='undo-design'){const d=activeDesign(),last=d.undo.pop();if(last)Object.assign(d,last,{dirty:true});render();return;}
});
root.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;const bindings={'mo-phone':'phone','mo-network':'network','mo-support':'support','mo-alternate':'alternate','mo-host':'raw','mo-port':'port','mo-lookup':'lookup','mo-count':'count','mo-manual':'manual','dw-complaint-note':'complaintNote'};if(bindings[id])state[bindings[id]]=v;
 if(id==='mo-cards-search'){state.cardsQuery=v;root.querySelector('#dw-card-results').innerHTML=cardResults();icons();}
 if(id==='mo-place-search'){state.placeQuery=v;const c=countryRecord(),p=provinceRecord();root.querySelector('#dw-place-results').innerHTML=placeResults(state.placeKind==='province'?c.regions.map(x=>({id:x.id,label:x[state.lang==='ar'?'ar':'en']})):(p?.districts||[]).map(x=>({id:x[0],label:x[state.lang==='ar'?1:2]})));icons();}
 if(id==='mo-note'){activeDesign().note=v;activeDesign().dirty=true;updateCanvas();}
 if(id==='dw-color'){const color=String(v);if(/^#[0-9a-f]{6}$/i.test(color)){if(!state.colorEditing){keepDesignUndo();state.colorEditing=true;}activeDesign().layers[state.selectedLayer].color=color;activeDesign().dirty=true;updateCanvas();}}
});
function updateCanvas(){const old=root.querySelector('#mo-canvas');if(old){old.outerHTML=canvas();icons();}}
root.addEventListener('focusout',e=>{if(e.target.id==='dw-color')state.colorEditing=false;if(e.target.id==='mo-host'&&state.raw.trim()){normalizeEndpoint();e.target.value=state.raw;root.querySelector('#mo-port').value=state.port;root.querySelector('#mo-endpoint-feedback').innerHTML=endpointFeedback();}});
root.addEventListener('paste',e=>{if(e.target.id!=='mo-host'||!e.clipboardData)return;const value=e.clipboardData.getData('text/plain');if(!value)return;e.preventDefault();state.raw=value;normalizeEndpoint();e.target.value=state.raw;root.querySelector('#mo-port').value=state.port;root.querySelector('#mo-endpoint-feedback').innerHTML=endpointFeedback();});
root.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='mo-country')state.country=v;if(id==='mo-marketing')state.marketing=e.target.checked;if(id==='mo-scenario')state.scenario=v;if(id==='mo-issue-plan'){state.selectedPlan=v;render();}if(id==='dw-status'){state.cardFilter=v;render();}if(id==='dw-source'){state.sourceFilter=v;render();}if(id==='dw-include-devices'){state.includeDevices=e.target.checked;render();}if(id==='dw-complaint-category')state.complaintCategory=v;
 if(id==='dw-cols'||id==='dw-rows'){keepDesignUndo();activeDesign()[id==='dw-cols'?'cols':'rows']=Number(v);render();}
 if(id==='mo-image'){const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){state.imageError=t('اختر PNG أو JPG أو WebP حتى 5 MB.','Choose PNG, JPG or WebP up to 5 MB.');render();return;}const key=templateKey(),version=++state.imageVersion;const reader=new FileReader();reader.onload=()=>{if(version!==state.imageVersion)return;if(drafts[key]){const d=drafts[key];d.image=String(reader.result);d.dirty=true;}state.imageError='';if(state.page==='design'&&key===templateKey())render();};reader.onerror=()=>{state.imageError=t('تعذر فتح الصورة؛ القالب السابق باقٍ.','Could not read the image; your previous template is kept.');if(state.page==='design')render();};reader.readAsDataURL(file);}
});
root.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-layer]');if(!el||state.page!=='design'||(e.button!==undefined&&e.button!==0))return;state.selectedLayer=el.dataset.layer;keepDesignUndo();drag={key:state.selectedLayer,box:root.querySelector('#mo-canvas').getBoundingClientRect(),id:e.pointerId};el.setPointerCapture?.(e.pointerId);e.preventDefault();});
root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||!drag.box.width||!drag.box.height)return;const v=activeDesign().layers[drag.key];v.x=Math.round(Math.max(12,Math.min(88,(e.clientX-drag.box.left)/drag.box.width*100)));v.y=Math.round(Math.max(12,Math.min(88,(e.clientY-drag.box.top)/drag.box.height*100)));const el=root.querySelector('[data-layer="'+drag.key+'"]');if(el){el.style.left=v.x+'%';el.style.top=v.y+'%';}e.preventDefault();});
function endDrag(){if(!drag)return;drag=null;render();}root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
root.addEventListener('keydown',e=>{const el=e.target.closest('[data-layer]');if(!el||state.page!=='design'||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;keepDesignUndo();state.selectedLayer=el.dataset.layer;const v=activeDesign().layers[state.selectedLayer],step=e.shiftKey?5:1;if(e.key==='ArrowLeft')v.x=Math.max(12,v.x-step);if(e.key==='ArrowRight')v.x=Math.min(88,v.x+step);if(e.key==='ArrowUp')v.y=Math.max(12,v.y-step);if(e.key==='ArrowDown')v.y=Math.min(88,v.y+step);e.preventDefault();el.style.left=v.x+'%';el.style.top=v.y+'%';});
render();

})();
</script>
