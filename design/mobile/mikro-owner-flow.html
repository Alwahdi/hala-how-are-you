<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap');
#mikro-owner-flow{--mo-bg:#0b1310;--mo-surface:#142019;--mo-raised:#1c2c21;--mo-line:#304135;--mo-ink:#f1f5e9;--mo-muted:#b0bdaf;--mo-lime:#bafa70;--mo-deep:#203b19;--mo-warn:#ffd08b;--mo-danger:#ffb7ac;font:400 16px/1.85 Cairo,system-ui,sans-serif;color:var(--mo-ink);color-scheme:dark}
#mikro-owner-flow *{box-sizing:border-box}
#mikro-owner-flow [hidden]{display:none!important}
#mikro-owner-flow .mo-stage{display:grid;justify-items:center;gap:16px;padding:24px 0 14px}
#mikro-owner-flow .mo-demo{width:min(100%,440px);display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:light-dark(#445340,#b0bdaf);font-size:12px;padding:0 10px}
#mikro-owner-flow .mo-demo>strong{font-weight:500;width:100%}
#mikro-owner-flow button,#mikro-owner-flow input,#mikro-owner-flow select{font:inherit;min-width:0}
#mikro-owner-flow button{overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
#mikro-owner-flow button:focus-visible,#mikro-owner-flow input:focus-visible,#mikro-owner-flow select:focus-visible{outline:3px solid var(--mo-lime);outline-offset:3px}
#mikro-owner-flow .mo-demo button{min-height:44px;background:transparent;border:1px solid currentColor;border-radius:12px;color:inherit;padding:7px 12px;font-size:12px}
#mikro-owner-flow .mo-phone{width:min(100%,440px);background:var(--mo-bg);border:1px solid var(--mo-line);border-radius:32px;overflow:clip;box-shadow:0 24px 70px #0002}
#mikro-owner-flow .mo-status{height:34px;padding:8px 24px;display:flex;justify-content:space-between;font:700 12px Manrope,sans-serif;direction:ltr}
#mikro-owner-flow .mo-status span:last-child{display:flex;gap:7px}
#mikro-owner-flow svg{width:22px;height:22px;flex-shrink:0}
#mikro-owner-flow .mo-status svg{width:16px;height:16px}
#mikro-owner-flow .mo-head{padding:15px 20px 18px;border-bottom:1px solid var(--mo-line);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#mikro-owner-flow .mo-head>div{flex:1;min-width:140px}
#mikro-owner-flow .mo-word{font:800 30px Manrope,sans-serif;letter-spacing:-1.8px;direction:ltr;display:inline-block}
#mikro-owner-flow .mo-word span{color:var(--mo-lime)}
#mikro-owner-flow .mo-router-name{font-weight:700;font-size:18px;overflow-wrap:anywhere}
#mikro-owner-flow .mo-small{font-size:13px;color:var(--mo-muted);line-height:1.9}
#mikro-owner-flow .mo-status-text{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:var(--mo-muted)}
#mikro-owner-flow .mo-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--mo-lime)}
#mikro-owner-flow .mo-dot.off{background:var(--mo-warn)}
#mikro-owner-flow main{padding:24px 22px 30px;min-height:570px}
#mikro-owner-flow h1,#mikro-owner-flow h2,#mikro-owner-flow h3,#mikro-owner-flow p{margin:0}
#mikro-owner-flow h1{font-size:31px;font-weight:700;line-height:1.6;letter-spacing:-.5px;margin:7px 0 10px}
#mikro-owner-flow h2{font-size:22px;font-weight:700;line-height:1.7}
#mikro-owner-flow h3{font-size:18px;font-weight:700;line-height:1.8}
#mikro-owner-flow .mo-copy{color:var(--mo-muted);font-size:16px;line-height:1.95}
#mikro-owner-flow .mo-kicker{font-size:14px;color:var(--mo-lime);display:flex;gap:8px;align-items:center;font-weight:600}
#mikro-owner-flow .mo-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:1px solid var(--mo-line);border-radius:18px;background:var(--mo-surface);color:var(--mo-ink);padding:13px 17px;font-size:17px;font-weight:600;text-align:center}
#mikro-owner-flow .mo-button.primary{background:var(--mo-lime);border-color:var(--mo-lime);color:#17220e}
#mikro-owner-flow .mo-button.ghost{background:transparent;border-color:transparent;color:var(--mo-muted)}
#mikro-owner-flow .mo-button.full{width:100%;margin-top:13px}
#mikro-owner-flow .mo-button.compact{font-size:14px;min-height:50px;padding:9px 12px;border-radius:14px}
#mikro-owner-flow .mo-button:disabled{opacity:.45;cursor:not-allowed}
#mikro-owner-flow .mo-back{border:0;background:transparent;color:var(--mo-muted);display:flex;align-items:center;gap:7px;font-size:16px;min-height:50px;padding:0;margin-bottom:14px}
#mikro-owner-flow .mo-panel{background:var(--mo-surface);border:1px solid var(--mo-line);border-radius:24px;padding:20px;margin:20px 0}
#mikro-owner-flow .mo-inline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#mikro-owner-flow .mo-between{justify-content:space-between}
#mikro-owner-flow .mo-badge{font-size:12px;line-height:1.9;padding:5px 10px;border-radius:9px;background:var(--mo-raised);color:var(--mo-lime);display:inline-block}
#mikro-owner-flow .mo-badge.warn{color:var(--mo-warn)}
#mikro-owner-flow .mo-note{font-size:14px;line-height:1.95;color:var(--mo-muted);display:flex;align-items:flex-start;gap:9px;margin:15px 0}
#mikro-owner-flow .mo-note svg{width:19px;height:19px;margin-top:5px}
#mikro-owner-flow .mo-notice{font-size:15px;background:var(--mo-surface);border-inline-start:3px solid var(--mo-warn);color:var(--mo-warn);padding:15px 17px;border-radius:0 16px 16px 0;margin:18px 0;line-height:1.95}
#mikro-owner-flow .mo-notice.good{color:var(--mo-ink);border-color:var(--mo-lime)}
#mikro-owner-flow .mo-error{color:var(--mo-danger);font-size:15px;margin:12px 0}
#mikro-owner-flow .mo-field{display:grid;gap:8px;margin:21px 0}
#mikro-owner-flow .mo-field label{font-size:15px;color:var(--mo-muted)}
#mikro-owner-flow input:not([type=checkbox]):not([type=range]),#mikro-owner-flow select{min-height:58px;padding:13px 14px;background:var(--mo-surface);border:1px solid var(--mo-line);border-radius:16px;width:100%;color:var(--mo-ink);font-size:17px}
#mikro-owner-flow input[type=range]{width:100%;min-height:44px;accent-color:var(--mo-lime)}
#mikro-owner-flow input[type=checkbox]{width:23px;height:23px;accent-color:var(--mo-lime);flex-shrink:0}
#mikro-owner-flow .mo-check{display:flex;gap:12px;align-items:center;min-height:58px;font-size:15px;line-height:1.85}
#mikro-owner-flow .mo-address{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:12px;direction:ltr}
#mikro-owner-flow .mo-address .mo-field{margin-bottom:0}
#mikro-owner-flow .mo-address label{direction:rtl;text-align:start}
#mikro-owner-flow .mo-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#mikro-owner-flow details{border-top:1px solid var(--mo-line);border-bottom:1px solid var(--mo-line);padding:12px 0;margin:20px 0}
#mikro-owner-flow summary{min-height:48px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mo-muted)}
#mikro-owner-flow summary:after{content:'+';margin-inline-start:auto;font:500 25px Manrope,sans-serif}
#mikro-owner-flow details[open]>summary:after{content:'−'}
#mikro-owner-flow .mo-find{padding:22px;background:var(--mo-deep);border:1px solid #486a37;border-radius:25px;margin:21px 0 16px}
#mikro-owner-flow .mo-find .mo-field{margin:14px 0 0}
#mikro-owner-flow .mo-find input{background:var(--mo-bg)}
#mikro-owner-flow .mo-tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
#mikro-owner-flow .mo-task{min-height:125px;border-radius:23px;background:var(--mo-surface);border:1px solid var(--mo-line);color:var(--mo-ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;padding:18px;text-align:start}
#mikro-owner-flow .mo-task svg{color:var(--mo-lime);width:28px;height:28px}
#mikro-owner-flow .mo-task strong{font-size:19px;font-weight:700}
#mikro-owner-flow .mo-live{display:flex;align-items:center;gap:18px;width:100%;border:1px solid var(--mo-line);background:var(--mo-surface);color:var(--mo-ink);border-radius:24px;padding:18px 20px;margin:18px 0;text-align:start}
#mikro-owner-flow .mo-live strong{font:800 42px/1.2 Manrope,sans-serif;color:var(--mo-lime)}
#mikro-owner-flow .mo-live>span{flex:1}
#mikro-owner-flow .mo-list{width:100%;display:flex;align-items:center;gap:13px;min-height:93px;border:0;border-bottom:1px solid var(--mo-line);background:transparent;color:var(--mo-ink);padding:17px 0;text-align:start}
#mikro-owner-flow .mo-list>span{flex:1;min-width:0;overflow-wrap:anywhere}
#mikro-owner-flow .mo-fact{padding:14px 0;border-bottom:1px solid var(--mo-line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
#mikro-owner-flow .mo-fact:last-child{border-bottom:0}
#mikro-owner-flow .mo-fact span{color:var(--mo-muted)}
#mikro-owner-flow .mo-fact b{font-weight:600;overflow-wrap:anywhere}
#mikro-owner-flow .mo-meter{height:9px;background:var(--mo-raised);border-radius:9px;overflow:hidden;margin:13px 0 20px}
#mikro-owner-flow .mo-meter>span{display:block;height:100%;background:var(--mo-lime)}
#mikro-owner-flow .mo-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 8px;border-top:1px solid var(--mo-line)}
#mikro-owner-flow .mo-nav button{min-height:68px;background:transparent;border:0;border-radius:17px;color:var(--mo-muted);display:grid;justify-items:center;align-content:center;gap:5px;font-size:12px}
#mikro-owner-flow .mo-nav button[aria-current]{color:var(--mo-lime);background:var(--mo-surface)}
#mikro-owner-flow .mo-homebar{width:100px;height:4px;border-radius:6px;background:var(--mo-ink);opacity:.6;margin:0 auto 9px}
#mikro-owner-flow .mo-canvas{position:relative;aspect-ratio:1.72;background:#eef3df;color:#16321c;border-radius:18px;overflow:hidden;margin:20px 0;isolation:isolate;touch-action:pan-y}
#mikro-owner-flow .mo-canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:-1}
#mikro-owner-flow .mo-canvas .mo-decoration{position:absolute;width:150px;height:150px;border-radius:50%;border:18px solid #bafa70;inset-inline-end:-55px;top:-40px;z-index:-1;opacity:.7}
#mikro-owner-flow .mo-layer{position:absolute;transform:translate(-50%,-50%);font-size:12px;line-height:1.6;max-width:85%;white-space:normal;text-align:center;touch-action:none;user-select:none;padding:2px 4px;border:1px solid transparent;border-radius:4px;overflow-wrap:anywhere}
#mikro-owner-flow .mo-layer.number{font:800 23px/1.4 Manrope,sans-serif;letter-spacing:.7px;white-space:nowrap}
#mikro-owner-flow .mo-layer.selected{border-color:#28592d;background:#ffffffd9}
#mikro-owner-flow .mo-layer.qr{display:flex;flex-direction:column;align-items:center;font-size:10px;background:#fff;color:#102514}
#mikro-owner-flow .mo-layer.qr svg{width:33px;height:33px}
#mikro-owner-flow .mo-choice{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#mikro-owner-flow .mo-choice button{min-height:50px;background:var(--mo-surface);border:1px solid var(--mo-line);color:var(--mo-muted);padding:9px 13px;border-radius:13px;font-size:15px}
#mikro-owner-flow .mo-choice button[aria-pressed=true]{border-color:var(--mo-lime);color:var(--mo-lime)}
#mikro-owner-flow .mo-reveal{border:0;background:transparent;color:var(--mo-lime);min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;gap:6px;padding:8px}
#mikro-owner-flow .mo-password{display:flex;align-items:center;gap:7px}
#mikro-owner-flow .mo-password input{flex:1}
#mikro-owner-flow [lang=en]{font-family:Manrope,Cairo,system-ui,sans-serif}
#mikro-owner-flow [dir=ltr] .mo-back svg{transform:rotate(180deg)}
@media(max-width:370px){#mikro-owner-flow main{padding:22px 16px}#mikro-owner-flow .mo-head{padding-inline:16px}#mikro-owner-flow h1{font-size:29px}#mikro-owner-flow .mo-pair{grid-template-columns:1fr;gap:0}#mikro-owner-flow .mo-address{grid-template-columns:minmax(0,1fr) 90px;gap:8px}#mikro-owner-flow .mo-find{padding:18px}#mikro-owner-flow .mo-task{padding:15px}#mikro-owner-flow .mo-task strong{font-size:17px}}
@media(prefers-reduced-motion:reduce){#mikro-owner-flow *{transition:none!important}}
</style>
<div id="mikro-owner-flow">
 <div class="mo-stage viz-dotted-background">
  <div class="mo-demo" dir="rtl"><strong>تصور تفاعلي · كل الأرقام والنتائج توضيحية</strong><button type="button" data-do="first-use">تجربة أول تشغيل</button><button type="button" data-do="offline">اختبار انقطاع الراوتر</button><button type="button" data-do="lang">English</button></div>
  <section class="mo-phone" aria-label="Mikro mobile owner experience">
   <div class="mo-status"><span>9:41</span><span><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
   <header class="mo-head"></header><main dir="rtl" lang="ar"></main><nav class="mo-nav" aria-label="التنقل الرئيسي"></nav><div class="mo-homebar"></div>
  </section>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('mikro-owner-flow'),main=root.querySelector('main'),head=root.querySelector('header'),nav=root.querySelector('nav');
 const state={lang:'ar',page:'home',router:'main',pendingNumber:false,profileDone:false,connectionId:null,phone:'',country:'+967',networkCountry:'',network:'',province:'',district:'',support:'',alternate:'',marketing:false,raw:'',host:'',port:'8729',transport:'tls',endpointMessage:'',endpointError:'',endpointPrevious:null,scenario:'success',lookup:'',lookupSource:'hotspot',lookupError:'',selectedPlan:'hs-day',selectedLayer:'username',mode:'one',count:1,cardMode:'generated',manual:'',batchName:'',passwordVisible:false,confirmed:0,issueError:'',imageError:''};
 const routers={main:{name:['الشبكة الرئيسية','Main network'],host:'192.168.88.1',port:'8729',connected:true,count:27,templates:{}},branch:{name:['شبكة الفرع','Branch network'],host:'branch.example.net',port:'8778',connected:false,count:9,templates:{}}};
 const plans=[{id:'hs-day',name:['يومية','Daily'],source:'Hotspot',data:'600 MB',price:100,index:0},{id:'um-day',name:['يومية','Daily'],source:'User Manager',data:'600 MB',price:100,index:0},{id:'um-week',name:['أسبوعية','Weekly'],source:'User Manager',data:'2 GB',price:250,index:1}];
 const layerDefs={network:{ar:'اسم الشبكة',en:'Network name',x:50,y:16,on:true},username:{ar:'اسم المستخدم',en:'Username',x:50,y:42,on:true},password:{ar:'كلمة المرور',en:'Password',x:50,y:58,on:false},plan:{ar:'الباقة',en:'Plan',x:50,y:68,on:true},price:{ar:'السعر',en:'Price',x:85,y:20,on:true},support:{ar:'الدعم الفني',en:'Support number',x:50,y:86,on:false},qr:{ar:'رمز QR',en:'QR code',x:82,y:55,on:false},note:{ar:'ملاحظة',en:'Note',x:50,y:77,on:false},pos:{ar:'نقطة البيع',en:'Sales point',x:24,y:20,on:false}};
 const drafts={};let drag=null;
 const profileFields=['network','networkCountry','province','district','support','alternate'];
 const profileSnapshot=()=>Object.fromEntries(profileFields.map(k=>[k,state[k]]));
 const t=(a,e)=>state.lang==='ar'?a:e,esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const r=()=>routers[state.router]||routers.main,routerName=()=>r().name[state.lang==='ar'?0:1],plan=()=>plans.find(p=>p.id===state.selectedPlan)||plans[0];
 const name=p=>p.name[state.lang==='ar'?0:1];
 const button=(action,label,primary=false,extra='full')=>`<button type="button" class="mo-button ${primary?'primary':''} ${extra}" data-do="${action}">${label}</button>`;
 const back=(p='home')=>`<button type="button" class="mo-back" data-do="go:${p}">${ic('arrow-right')}${t('رجوع','Back')}</button>`;
 const badge=(v,w=false)=>`<span class="mo-badge ${w?'warn':''}">${v}</span>`;
 const note=(v,w=false)=>`<div class="mo-notice ${w?'':'good'}" role="status">${v}</div>`;
 const fact=(k,v)=>`<div class="mo-fact"><span>${k}</span><b>${v}</b></div>`;
 const help=(title,copy)=>`<details><summary>${ic('circle-help')}${title}</summary><p class="mo-copy">${copy}</p></details>`;
 const field=(id,label,value='',placeholder='',extra='')=>`<div class="mo-field"><label for="mo-${id}">${label}</label><input id="mo-${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}></div>`;
 function digits(v){return String(v).replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)-(c<='٩'?1632:1776)));}
 function parseEndpoint(raw,port){
  let text=digits(raw).trim().replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'');
  if(!text)return {error:'empty'};
  if(/\s/.test(text))return {error:'space'};
  const scheme=text.match(/^([a-z][a-z0-9+.-]*):\/\//i);if(scheme&&!/^https?$/i.test(scheme[1]))return {error:'scheme'};
  const stripped=!!scheme;if(scheme)text=text.slice(scheme[0].length);else if(text.startsWith('//'))text=text.slice(2);
  const authority=text.split(/[/?#]/)[0];if(authority.includes('@')||authority.includes('%'))return {error:'credentials'};
  let host='',pastedPort='',ipv6=false;
  if(authority.startsWith('[')){const m=authority.match(/^\[([a-f0-9:]+)\](?::([0-9]+))?$/i);if(!m)return {error:'host'};host=m[1];pastedPort=m[2]||'';ipv6=true;}
  else if((authority.match(/:/g)||[]).length>1){host=authority;ipv6=true;}
  else {const m=authority.match(/^([^:]+)(?::([0-9]+))?$/);if(!m)return {error:'port'};host=m[1];pastedPort=m[2]||'';}
  if(ipv6){try{new URL('http://['+host+']/');}catch{return {error:'host'};}}
  else if(/^[0-9.]+$/.test(host)){if(!/^(?:0|[1-9][0-9]{0,2})(?:\.(?:0|[1-9][0-9]{0,2})){3}$/.test(host)||host.split('.').some(n=>Number(n)>255))return {error:'host'};}
  else {host=host.replace(/\.$/,'').toLowerCase();if(host.length>253||!host.split('.').every(s=>/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(s)))return {error:'host'};}
  const selected=digits(pastedPort||port||'8729');if(!/^[0-9]+$/.test(selected)||Number(selected)<1||Number(selected)>65535)return {error:'port'};
  return {host:host.toLowerCase(),port:String(Number(selected)),changed:stripped||text!==authority||!!pastedPort,pastedPort:!!pastedPort,webPort:['80','443','8291'].includes(String(Number(selected)))};
 }
 function endpointError(code){return ({empty:t('اكتب عنوان الراوتر أولًا.','Enter the router address first.'),space:t('العنوان يحتوي مسافة داخلية. تحقق من النسخ.','The address contains a space. Check the pasted value.'),scheme:t('الصق IP أو اسم DDNS أو رابط http/https.','Paste an IP, DDNS name, or http/https URL.'),credentials:t('الصق العنوان فقط بدون اسم مستخدم أو كلمة مرور داخله.','Paste the address without embedded credentials.'),host:t('العنوان غير صالح. راجع IP أو اسم DDNS.','Invalid IP or DDNS hostname.'),port:t('المنفذ يجب أن يكون رقمًا من 1 إلى 65535.','Port must be a number from 1 to 65535.')})[code];}
 function normalizeEndpoint(){const result=parseEndpoint(state.raw,state.port);state.endpointError=result.error?endpointError(result.error):'';if(result.error)return false;state.endpointPrevious={raw:state.raw,port:state.port};state.host=result.host;state.raw=result.host;state.port=result.port;state.endpointMessage=t('تم ترتيب العنوان','Address formatted')+(result.pastedPort?t(' واستخراج المنفذ الملصوق.',' and the pasted port extracted.'):'.')+(result.webPort?t(' تأكد أنه منفذ API، فقد يكون منفذ ويب أو Winbox.',' Check that this is the API port; it may be a web or Winbox port.'):'');return true;}
 function templateKey(){return state.router+':'+state.selectedPlan;}
 function editor(){const key=templateKey();if(!drafts[key])drafts[key]={style:'orbit',image:'',status:'new',dirty:false,note:'',layers:Object.fromEntries(Object.entries(layerDefs).map(([k,v])=>[k,{...v}]))};return drafts[key];}
 function stateSave(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Mikro owner journey',language:state.lang,screen:state.page,router:state.router,plan:state.selectedPlan},privateContent:null}).catch(()=>{});}
 function restore(value){const m=value?.modelContent;if(m&&['ar','en'].includes(m.language))state.lang=m.language;}
 restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
 function title(kicker,heading,copy=''){return `<div class="mo-kicker">${kicker}</div><h1>${heading}</h1>${copy?`<p class="mo-copy">${copy}</p>`:''}`;}

 function render(){const ar=state.lang==='ar';main.dir=head.dir=nav.dir=ar?'rtl':'ltr';main.lang=ar?'ar':'en';const setup=['registration','profile','routers','connect','connection-result','account'].includes(state.page);head.innerHTML=setup?`<div><span class="mo-word">Mikro<span>.</span></span><div class="mo-small">${t('شبكتك، من جوالك','Your network, from your phone')}</div></div>${state.page==='routers'?button('go:account',ic('user-round')+t('الحساب','Account'),false,'compact'):''}`:`<div><div class="mo-router-name">${esc(routerName())}</div><div class="mo-status-text"><span class="mo-dot ${r().connected?'':'off'}"></span>${r().connected?t('متصل · محاكاة','Connected · demo'):t('غير متصل · المحفوظ فقط','Offline · saved data only')}</div></div>${button('go:routers',ic('log-out')+t('الراوترات','Routers'),false,'compact')}`;const screens={home,registration,profile,routers:routerPicker,connect,'connection-result':connectionResult,'plan-setup':planSetup,design,card,sessions,issue,'review-issue':reviewIssue,done,batches,account};main.innerHTML=(screens[state.page]||home)();nav.hidden=setup;const active=['plan-setup','design'].includes(state.page)?'plan-setup':['issue','review-issue','done','batches'].includes(state.page)?'batches':state.page==='sessions'?'sessions':'home';nav.innerHTML=setup?'':[['home','house','الرئيسية','Home'],['sessions','users-round','المتصلون','Sessions'],['batches','layers','الدفعات','Batches'],['plan-setup','panels-top-left','القوالب','Templates']].map(([p,i,a,e])=>`<button type="button" data-do="go:${p}" ${p===active?'aria-current="page"':''}>${ic(i)}<span>${t(a,e)}</span></button>`).join('');root.querySelectorAll('button,summary').forEach(e=>e.classList.add('cursor-interaction'));const db=root.querySelector('.mo-demo');db.dir=ar?'rtl':'ltr';db.querySelector('strong').textContent=t('تصور تفاعلي · كل الأرقام والنتائج توضيحية','Interactive concept · all values and results are illustrative');db.querySelector('[data-do="lang"]').textContent=ar?'English':'العربية';db.querySelector('[data-do="first-use"]').textContent=t('تجربة أول تشغيل','Try first launch');db.querySelector('[data-do="offline"]').textContent=r().connected?t('اختبار انقطاع الراوتر','Test router disconnect'):t('إعادة الاتصال التجريبي','Reconnect demo router');icons();}

 root.addEventListener('click',event=>{const b=event.target.closest('button[data-do]');if(!b||b.disabled)return;const a=b.dataset.do;

 root.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;const bindings={'mo-phone':'phone','mo-network':'network','mo-network-country':'networkCountry','mo-province':'province','mo-district':'district','mo-support':'support','mo-alternate':'alternate','mo-host':'raw','mo-port':'port','mo-lookup':'lookup','mo-count':'count','mo-manual':'manual'};if(bindings[id])state[bindings[id]]=v;if(id==='mo-note'){editor().note=v;editor().dirty=true;updateCanvas();}if(id==='mo-x'||id==='mo-y'){const k=id==='mo-x'?'x':'y';editor().layers[state.selectedLayer][k]=Number(v);editor().dirty=true;root.querySelector('#mo-'+k+'-value').textContent=v+'%';updateCanvas();}});

 root.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='mo-country')state.country=v;if(id==='mo-marketing')state.marketing=e.target.checked;if(id==='mo-scenario')state.scenario=v;if(id==='mo-lookup-system')state.lookupSource=v;if(id==='mo-transport'){const old=state.transport;state.transport=v;if(state.port===(old==='tls'?'8729':'8728'))state.port=v==='tls'?'8729':'8728';render();}if(id==='mo-issue-plan'){state.selectedPlan=v;render();}if(id==='mo-layer'){state.selectedLayer=v;render();}if(id==='mo-visible'){editor().layers[state.selectedLayer].on=e.target.checked;editor().dirty=true;updateCanvas();}if(id==='mo-image'){const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){state.imageError=t('اختر صورة PNG أو JPG أو WebP حتى 5 MB.','Choose a PNG, JPG or WebP image up to 5 MB.');render();return;}const key=templateKey();const reader=new FileReader();reader.onload=()=>{if(drafts[key]){drafts[key].image=String(reader.result);drafts[key].dirty=true;}state.imageError='';if(state.page==='design'&&key===templateKey())render();};reader.onerror=()=>{state.imageError=t('تعذر قراءة الصورة. التصميم السابق باقٍ.','Could not read image. Your previous design is kept.');if(state.page==='design')render();};reader.readAsDataURL(file);}});
 root.addEventListener('pointerdown',e=>{const layer=e.target.closest('[data-layer]');if(!layer||state.page!=='design')return;state.selectedLayer=layer.dataset.layer;const canvasEl=root.querySelector('#mo-canvas');drag={key:state.selectedLayer,box:canvasEl.getBoundingClientRect(),id:e.pointerId};layer.setPointerCapture?.(e.pointerId);e.preventDefault();});
